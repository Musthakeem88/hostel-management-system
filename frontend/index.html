<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1f3a41">
  <title>Hostel Management System</title>

  <script src="/js/theme.js"></script>

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <aside class="side">
    <h1 class="brand">Hostel <br>Management</h1>

    <nav id="nav" aria-label="Main">
      <button type="button" data-view="dashboard" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Dashboard</span>
      </button>
      <button type="button" data-view="rooms">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17"/><path d="M3 21h18"/><circle cx="15" cy="12" r="1"/></svg>
        <span>Rooms</span>
      </button>
      <button type="button" data-view="students">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5c2 .7 3.5 2.6 3.5 5.5"/></svg>
        <span>Students</span>
      </button>
      <button type="button" data-view="inspections">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m9 13 2 2 4-4"/></svg>
        <span>Inspections</span>
      </button>
      <button type="button" data-view="damage">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><path d="M12 17.5v.01"/></svg>
        <span><span class="long">Damage and fines</span><span class="short">Fines</span></span>
      </button>
      <button type="button" data-view="repairs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0 5 5l-9.4 9.4a2.1 2.1 0 0 1-3-3l9.4-9.4z"/></svg>
        <span>Repairs</span>
      </button>
    </nav>

    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="theme-label"></span>
    </button>
  </aside>

  <main class="main">
    <header class="top">
      <h2 id="title">Dashboard</h2>
      <span class="muted" id="today"></span>
    </header>

    <section id="view" tabindex="-1"></section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Scripts run in this order and share one global scope -->
  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/rooms.js"></script>
  <script src="/js/views/students.js"></script>
  <script src="/js/views/inspections.js"></script>
  <script src="/js/views/damage.js"></script>
  <script src="/js/views/repairs.js"></script>
  <script src="/js/actions.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
