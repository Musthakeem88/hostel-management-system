
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Hostel Management System</h1>
    <p>University Hostel Dashboard</p>
  </header>

  <main>
    <h2>Dashboard</h2>

    <section class="cards">
      <article class="card">
        <h3>Total Rooms</h3>
        <p>120</p>
      </article>

      <article class="card">
        <h3>Occupied Rooms</h3>
        <p>95</p>
      </article>

      <article class="card">
        <h3>Available Rooms</h3>
        <p>25</p>
      </article>

      <article class="card">
        <h3>Pending Repairs</h3>
        <p>8</p>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
