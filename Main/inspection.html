
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Inspection | Hostel Management</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1>Room Inspection</h1>
        <p class="text-muted">Record room and property conditions.</p>
      </div>
      <a href="index.html" class="btn btn-outline-secondary">Dashboard</a>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <form id="inspectionForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="roomNumber">Room Number</label>
              <input class="form-control" id="roomNumber" required
                     placeholder="e.g. A101">
            </div>

            <div class="col-md-6">
              <label class="form-label" for="inspectionType">Inspection Type</label>
              <select class="form-select" id="inspectionType" required>
                <option value="">Choose type</option>
                <option value="Check-in">Check-in</option>
                <option value="Check-out">Check-out</option>
                <option value="Routine">Routine inspection</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label" for="item">Property Item</label>
              <select class="form-select" id="item" required>
                <option value="">Choose item</option>
                <option>Bed</option>
                <option>Mattress</option>
                <option>Desk</option>
                <option>Chair</option>
                <option>Wardrobe</option>
                <option>Room Key</option>
                <option>Mirror</option>
                <option>Ceiling Fan</option>
                <option>Tube Light</option>
                <option>Window</option>
                <option>Wall</option>
                <option>Sink</option>
                <option>Washroom</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label" for="condition">Condition</label>
              <select class="form-select" id="condition" required>
                <option value="">Choose condition</option>
                <option value="Good">Good</option>
                <option value="Needs Repair">Needs Repair</option>
                <option value="Damaged">Damaged</option>
                <option value="Missing">Missing</option>
              </select>
            </div>

            <div class="col-12">
              <label class="form-label" for="notes">Inspection Notes</label>
              <textarea class="form-control" id="notes" rows="3"
                        placeholder="Describe any damage or problems"></textarea>
            </div>

            <div class="col-12">
              <label class="form-label" for="photo">Damage Photo (optional)</label>
              <input class="form-control" type="file" id="photo" accept="image/*">
              <small class="text-muted">Photo selection is available, but uploading and saving photos will be implemented later.</small>
            </div>

            <div class="col-12">
              <button class="btn btn-primary" type="submit">Save Inspection</button>
              <button class="btn btn-outline-secondary" type="reset">Clear Form</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <h3 class="mt-5 mb-3">Inspection Records</h3>
    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <thead class="table-dark">
          <tr>
            <th>Room</th>
            <th>Type</th>
            <th>Item</th>
            <th>Condition</th>
            <th>Notes</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="inspectionRecords">
          <tr>
            <td colspan="6" class="text-center text-muted">
              No inspections recorded yet.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/inspection.js"></script>
</body>
</html>
